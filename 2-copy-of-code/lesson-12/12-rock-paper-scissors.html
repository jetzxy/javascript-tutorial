<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper Scissors</title>
    <style>
      body {
        background-color: rgb(25, 25, 25);
        color: white;
        font-family: Ariel;
      }

      .title {
        font-size: 30px;
        font-weight: bold;
      }

      .move-icon {
        height: 50px;
      }

      .move-button {
        background-color: transparent;
        border: 3px solid white;
        height: 120px;
        width: 120px;
        border-radius: 60px;
        margin-right: 10px;
      }

      .result {
        font-size: 25px;
        font-weight: bold;
      }

      .score {
        margin-top: 60px;
      }

      .reset-score-button,
      .auto-play-button {
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="playGame('rock')">
      <img class="move-icon" src="rock-emoji.png" alt="rock" />
    </button>
    <button class="move-button" onclick="playGame('paper')">
      <img class="move-icon" src="paper-emoji.png" alt="paper" />
    </button>
    <button class="move-button" onclick="playGame('scissors')">
      <img class="move-icon" src="scissors-emoji.png" alt="scissors" />
    </button>

    <p class="js-result result"></p>
    <p class="js-move"></p>
    <p class="js-score score"></p>
    <button
      class="reset-score-button"
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
      "
    >
      Reset score
    </button>

    <button class="auto-play-button" onclick="autoPlay()">Auto Play</button>

    <script src="index.js"></script>
  </body>
</html>
