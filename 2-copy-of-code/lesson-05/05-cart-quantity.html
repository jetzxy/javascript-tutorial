<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <p>Cart Quantity</p>

    <button onclick="console.log(`Cart Quantity: ${cartQuantity}`)">Show Quantity</button>
    <button onclick="console.log(++cartQuantity)">Add to Cart</button>
    <button onclick="console.log(cartQuantity += 2)">+2</button>
    <button onclick="console.log(cartQuantity += 3)">+3</button>
    <button onclick="console.log(cartQuantity += 4)">+4</button>
    <button onclick="console.log(cartQuantity += 5)">+5</button>
    <button onclick="console.log(cartQuantity = 0)">Reset Cart</button>
    <button onclick="console.log(--cartQuantity)">Remove from Cart</button>
    <button onclick="console.log(cartQuantity -= 2)">-2</button>
    <button onclick="console.log(cartQuantity -= 3)">-3</button>    

    <script>
        let cartQuantity = 0;
    </script>
</body>
</html>
