<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper Scissors</title>
    <link rel="stylesheet" href="12r.css" />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
      <img class="move-icon" src="rock-emoji.png" alt="rock" />
    </button>
    <button class="move-button js-paper-button">
      <img class="move-icon" src="paper-emoji.png" alt="paper" />
    </button>
    <button class="move-button js-scissors-button">
      <img class="move-icon" src="scissors-emoji.png" alt="scissors" />
    </button>

    <p class="js-result result"></p>
    <p class="js-move"></p>
    <p class="js-score score"></p>
    <button class="reset-score-button js-reset-score-button">
      Reset score
    </button>

    <button class="auto-play-button js-auto-play-button">Auto Play</button>
    <p class="js-reset-confirmation"></p>

    <script src="12r.js"></script>
  </body>
</html>
