      const testJet = (str) => {
        let jet = [...str].reduce((acc, char) => {
          acc[char] = (acc[char] || 0) + 1;
          return acc;
        }, {});
        return jet;
      };

      const reverseText = (word) => {
        let result = [...word].reverse().join("");
        return result;
      };
